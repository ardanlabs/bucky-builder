name: Build
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even when bucky-builder is already at the latest whisper.cpp tag (use to backfill artifacts onto an existing release).'
        type: boolean
        default: false
  schedule:
    # Check twice daily for a new whisper.cpp release tag and only trigger
    # downstream builds when one is found.
    - cron: '15 */12 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-progress runs for PRs. On main (push / cron / manual)
  # we let runs queue so a cancelled run never lingers on the commit and
  # paints a red X on an otherwise-successful release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-digest-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Test digest manifest generation
        run: .github/scripts/tests/test-build-digests.sh

  # check-version compares the latest upstream whisper.cpp release tag against
  # the bucky-builder repo's own latest release tag. All build jobs gate on
  # whisper-tag != current-tag so the scheduled check is a no-op until a new
  # whisper.cpp version ships.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      whisper-tag: ${{ steps.tags.outputs.whisper-tag }}
      current-tag: ${{ steps.tags.outputs.current-tag }}
      generated: ${{ steps.tags.outputs.generated }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          fetch-tags: 'true'
      - name: Fetch whisper tags
        run: |
          cd whisper.cpp
          git fetch --prune --prune-tags --unshallow --no-recurse-submodules
      - name: Determine whisper.cpp tag name
        id: whispertag
        uses: ./.github/actions/get-tag-name
        with:
          repo-path: ./whisper.cpp
      - name: Fetch tags
        run: |
          git fetch --prune --prune-tags --unshallow --no-recurse-submodules
      - name: Determine own tag name
        id: currenttag
        uses: ./.github/actions/get-tag-name
        with:
          repo-path: .
      - name: Save tags
        id: tags
        run: |
          echo "whisper-tag=${{ steps.whispertag.outputs.name }}" >> "$GITHUB_OUTPUT"
          echo "current-tag=${{ steps.currenttag.outputs.name }}" >> "$GITHUB_OUTPUT"
          echo "generated=$(git -C whisper.cpp show -s --format=%cI '${{ steps.whispertag.outputs.name }}')" >> "$GITHUB_OUTPUT"
          echo "Upstream whisper.cpp: ${{ steps.whispertag.outputs.name }}"
          echo "bucky-builder latest: ${{ steps.currenttag.outputs.name }}"

  # ─── CPU ────────────────────────────────────────────────────────────────
  # bucky-builder packages library-only CPU bundles with the same naming and
  # release cadence as its accelerated Linux artifacts. Upstream also ships
  # CPU archives, but they include executables bucky does not use.

  build-cpu-amd64:
    needs: check-version
    if: ${{ needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: ${{ needs.check-version.outputs.whisper-tag }}
          fetch-tags: 'true'
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgomp1 git libssl-dev libcurl4-openssl-dev wget
      - name: Setup cmake 4.2.0
        run: |
          mkdir -p ./cmake-4.2.0
          cd ./cmake-4.2.0
          wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.2.0/cmake-4.2.0-linux-x86_64.sh
          sudo sh cmake.sh --prefix=/usr/local --skip-license
          cd ..
          rm -rf cmake-4.2.0
      - name: Build amd64
        working-directory: whisper.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_BACKEND_DL=ON \
            -DCMAKE_INSTALL_BINDIR=lib
          cmake --build build --config Release -j $(nproc)
          cmake --install build --prefix dist
      - name: Pack artifacts
        run: |
          tar -czvf whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-x64.tar.gz \
            --transform "s,./,whisper-${{ needs.check-version.outputs.whisper-tag }}/," \
            -C ./whisper.cpp/dist/lib .
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-x64.tar.gz
          name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-x64.tar.gz
          archive: false

  build-cpu-arm64:
    needs: check-version
    if: ${{ needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force }}
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: ${{ needs.check-version.outputs.whisper-tag }}
          fetch-tags: 'true'
      - name: Install dependencies + GCC 14
        # Ubuntu 22.04 ships GCC 11; whisper.cpp's ggml needs newer C++17.
        # Pull GCC 14 from the ubuntu-toolchain-r/test PPA in ~30s instead of
        # building from source (~30min).
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgomp1 git libssl-dev libcurl4-openssl-dev wget gcc-14 g++-14
      - name: Setup cmake 4.2.0
        run: |
          mkdir -p ./cmake-4.2.0
          cd ./cmake-4.2.0
          wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.2.0/cmake-4.2.0-linux-aarch64.sh
          sudo sh cmake.sh --prefix=/usr/local --skip-license
          cd ..
          rm -rf cmake-4.2.0
      - name: Build arm64
        working-directory: whisper.cpp
        run: |
          export CC=gcc-14
          export CXX=g++-14
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_BACKEND_DL=ON \
            -DCMAKE_INSTALL_BINDIR=lib
          cmake --build build --config Release -j $(nproc)
          cmake --install build --prefix dist
      - name: Pack artifacts
        run: |
          tar -czvf whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-arm64.tar.gz \
            --transform "s,./,whisper-${{ needs.check-version.outputs.whisper-tag }}/," \
            -C ./whisper.cpp/dist/lib .
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-arm64.tar.gz
          name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-arm64.tar.gz
          archive: false

  # ─── CUDA ───────────────────────────────────────────────────────────────
  # CUDA 12.9 baseline. Add a cuda-13 sibling job when consumer GPUs / Jetson
  # firmware widely move to CUDA 13 — same pattern yzma uses to ship both.

  build-cuda-amd64:
    needs: check-version
    if: ${{ needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force }}
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu24.04
      options: --platform linux/amd64
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: ${{ needs.check-version.outputs.whisper-tag }}
          fetch-tags: 'true'
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y build-essential ninja-build libgomp1 git libssl-dev libcurl4-openssl-dev wget
      - name: Setup cmake 4.2.0
        run: |
          mkdir -p ./cmake-4.2.0
          cd ./cmake-4.2.0
          wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.2.0/cmake-4.2.0-linux-x86_64.sh
          sh cmake.sh --prefix=/usr/local --skip-license
          cd ..
          rm -rf cmake-4.2.0
      - name: Build amd64
        working-directory: whisper.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined" \
            -DCMAKE_CUDA_ARCHITECTURES="86;89" \
            -DCMAKE_DISABLE_FIND_PACKAGE_NCCL=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_CUDA=ON \
            -DGGML_BACKEND_DL=ON \
            -DCMAKE_INSTALL_BINDIR=lib
          cmake --build build --config Release -j $(nproc)
          cmake --install build --prefix dist
      - name: Pack artifacts
        run: |
          tar -czvf whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-x64.tar.gz \
            --transform "s,./,whisper-${{ needs.check-version.outputs.whisper-tag }}/," \
            -C ./whisper.cpp/dist/lib .
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-x64.tar.gz
          name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-x64.tar.gz
          archive: false

  build-cuda-arm64:
    needs: check-version
    if: ${{ needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force }}
    runs-on: ubuntu-22.04-arm
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu22.04
      options: --platform linux/arm64
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: ${{ needs.check-version.outputs.whisper-tag }}
          fetch-tags: 'true'
      - name: Install dependencies + GCC 14
        # Container is nvidia/cuda:12.9.1-devel-ubuntu22.04 — already root,
        # so no sudo. Pull GCC 14 from ubuntu-toolchain-r/test (CUDA 12.9
        # supports GCC <= 14 as host compiler).
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y software-properties-common
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt update
          apt install -y build-essential ninja-build libgomp1 git libssl-dev libcurl4-openssl-dev wget gcc-14 g++-14
      - name: Setup cmake 4.2.0
        run: |
          mkdir -p ./cmake-4.2.0
          cd ./cmake-4.2.0
          wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.2.0/cmake-4.2.0-linux-aarch64.sh
          sh cmake.sh --prefix=/usr/local --skip-license
          cd ..
          rm -rf cmake-4.2.0
      - name: Build arm64
        working-directory: whisper.cpp
        run: |
          export CC=gcc-14
          export CXX=g++-14
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined" \
            -DCMAKE_CUDA_ARCHITECTURES="87" \
            -DCMAKE_DISABLE_FIND_PACKAGE_NCCL=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_CUDA=ON \
            -DGGML_BACKEND_DL=ON \
            -DCMAKE_INSTALL_BINDIR=lib
          cmake --build build --config Release -j $(nproc)
          cmake --install build --prefix dist
      - name: Pack artifacts
        run: |
          tar -czvf whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-arm64.tar.gz \
            --transform "s,./,whisper-${{ needs.check-version.outputs.whisper-tag }}/," \
            -C ./whisper.cpp/dist/lib .
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-arm64.tar.gz
          name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-arm64.tar.gz
          archive: false

  # ─── Vulkan ─────────────────────────────────────────────────────────────
  # Vulkan covers AMD / Intel / NVIDIA / Qualcomm GPUs with a single binary.
  # whisper.cpp's Vulkan backend is less mature than llama.cpp's but still
  # useful as a CUDA-free GPU fallback.

  build-vulkan-amd64:
    needs: check-version
    if: ${{ needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: ${{ needs.check-version.outputs.whisper-tag }}
          fetch-tags: 'true'
      - name: Install dependencies + Vulkan SDK
        # LunarG's apt repo ships the full Vulkan SDK system-wide, which is
        # far more reliable than fetching their .tar.xz (the tarball URL
        # pattern shifts between releases). On the runner, ubuntu-latest =
        # noble (24.04), so use the noble package list. No `source
        # setup-env.sh` needed afterwards — pkg-config + /usr/include find
        # everything.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgomp1 git libssl-dev libcurl4-openssl-dev mesa-vulkan-drivers wget gpg
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
      - name: Setup cmake 4.2.0
        run: |
          mkdir -p ./cmake-4.2.0
          cd ./cmake-4.2.0
          wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.2.0/cmake-4.2.0-linux-x86_64.sh
          sudo sh cmake.sh --prefix=/usr/local --skip-license
          cd ..
          rm -rf cmake-4.2.0
      - name: Build amd64
        working-directory: whisper.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined" \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            -DGGML_BACKEND_DL=ON \
            -DCMAKE_INSTALL_BINDIR=lib
          cmake --build build --config Release -j $(nproc)
          cmake --install build --prefix dist
      - name: Pack artifacts
        run: |
          tar -czvf whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-x64.tar.gz \
            --transform "s,./,whisper-${{ needs.check-version.outputs.whisper-tag }}/," \
            -C ./whisper.cpp/dist/lib .
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-x64.tar.gz
          name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-x64.tar.gz
          archive: false

  build-vulkan-arm64:
    needs: check-version
    if: ${{ needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force }}
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: ${{ needs.check-version.outputs.whisper-tag }}
          fetch-tags: 'true'
      - name: Install dependencies + GCC 14
        # Pull GCC 14 from ubuntu-toolchain-r/test PPA in ~30s instead of
        # building from source (~30min).
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgomp1 git libssl-dev libcurl4-openssl-dev mesa-vulkan-drivers wget gcc-14 g++-14
      - name: Setup cmake 4.2.0
        run: |
          mkdir -p ./cmake-4.2.0
          cd ./cmake-4.2.0
          wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.2.0/cmake-4.2.0-linux-aarch64.sh
          sudo sh cmake.sh --prefix=/usr/local --skip-license
          cd ..
          rm -rf cmake-4.2.0
      - name: Set Vulkan SDK version
        run: echo "VULKAN_SDK_VERSION=1.4.335.0" >> "$GITHUB_ENV"
      - name: Use Vulkan SDK Cache
        uses: actions/cache@v5
        id: cache-sdk
        with:
          path: ./vulkan_sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}-arm64-v2
      - name: Setup Vulkan SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-setup-vulkan
        with:
          path: ./vulkan_sdk
          version: ${{ env.VULKAN_SDK_VERSION }}
          osversion: 22.04
      - name: Build arm64
        working-directory: whisper.cpp
        run: |
          export CC=gcc-14
          export CXX=g++-14
          source $GITHUB_WORKSPACE/vulkan_sdk/setup-env.sh
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined" \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            -DGGML_BACKEND_DL=ON \
            -DCMAKE_INSTALL_BINDIR=lib
          cmake --build build --config Release -j $(nproc)
          cmake --install build --prefix dist
      - name: Pack artifacts
        run: |
          tar -czvf whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-arm64.tar.gz \
            --transform "s,./,whisper-${{ needs.check-version.outputs.whisper-tag }}/," \
            -C ./whisper.cpp/dist/lib .
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-arm64.tar.gz
          name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-arm64.tar.gz
          archive: false

  # ─── macOS ──────────────────────────────────────────────────────────────
  # Universal (arm64 + x86_64) xcframework with Metal + CoreML embedded.
  # whisper.cpp upstream ships its own xcframework, but theirs is a 7-slice
  # bundle (iOS device+sim, macOS universal, visionOS device+sim, tvOS
  # device+sim) that bucky never uses past the macOS slice. We run their
  # build-xcframework.sh as-is to inherit upstream improvements, then call
  # xcodebuild -create-xcframework again with only the macOS slice so the
  # download bucky pulls is small. The output path the zip preserves
  # (build-apple/whisper.xcframework/macos-arm64_x86_64/whisper.framework
  # /Versions/A/whisper) is what bucky's extractDarwinXCFramework expects.

  build-darwin-xcframework:
    needs: check-version
    if: ${{ needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force }}
    runs-on: macos-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: ${{ needs.check-version.outputs.whisper-tag }}
          fetch-tags: 'true'
      - name: Build full xcframework (upstream script)
        working-directory: whisper.cpp
        run: |
          ./build-xcframework.sh
      - name: Repackage as macOS-only xcframework
        # -debug-symbols is intentionally omitted. The dSYM upstream's
        # script produces at build-macos/dSYMs/whisper.dSYM is rejected
        # as "not a valid debug symbols file" by xcodebuild on the
        # current macos-latest Xcode (see ardanlabs/bucky-builder run
        # 26759817672). bucky never ships or uses the dSYM — it just
        # dlopens the binary inside the framework — so dropping it
        # produces a functionally complete xcframework for our use case.
        # Upstream itself omits -debug-symbols on the static-xcframework
        # path in build-xcframework.sh, which is what we are mirroring.
        run: |
          mkdir -p package/build-apple
          xcodebuild -create-xcframework \
            -framework whisper.cpp/build-macos/framework/whisper.framework \
            -output package/build-apple/whisper.xcframework
      - name: Pack artifact
        # zip --symlinks preserves the macOS framework's versioned
        # symlinks (Versions/Current -> A, etc.). Without it the unzipped
        # framework is invalid and dlopen fails.
        run: |
          cd package
          zip --symlinks -r ../whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-darwin-metal-universal.zip build-apple/whisper.xcframework
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-darwin-metal-universal.zip
          name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-darwin-metal-universal.zip
          archive: false

  # ─── Windows ────────────────────────────────────────────────────────────
  # x64 CPU and CUDA DLLs. We do NOT pull SDL2 since we drop examples. Build
  # flags mirror Linux (GGML_CPU_ALL_VARIANTS=ON for runtime ISA dispatch,
  # GGML_BACKEND_DL=ON for dlopen-style backend loading). The CUDA archive
  # includes the CUDA runtime DLLs so consumers only need an NVIDIA driver,
  # not a locally installed CUDA toolkit.

  build-windows-cpu-x64:
    needs: check-version
    if: ${{ needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force }}
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: ${{ needs.check-version.outputs.whisper-tag }}
          fetch-tags: 'true'
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build x64
        working-directory: whisper.cpp
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_EXAMPLES=OFF `
            -DWHISPER_BUILD_SERVER=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_BMI2=OFF `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_BACKEND_DL=ON
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
          cmake --install build --prefix dist --config Release
      - name: Pack artifact
        # Stage the DLLs under whisper-<TAG>/ inside the zip to match the
        # Linux tarball layout (top-level versioned directory). bucky's
        # extractWindowsZip flattens regardless, but a versioned root makes
        # the zip easy to inspect by hand.
        shell: pwsh
        working-directory: whisper.cpp
        run: |
          $tag = "${{ needs.check-version.outputs.whisper-tag }}"
          New-Item -ItemType Directory -Force -Path "package/whisper-$tag" | Out-Null
          Copy-Item dist/bin/*.dll "package/whisper-$tag/"
          Compress-Archive -Path "package/whisper-$tag" -DestinationPath "../whisper-$tag-bin-windows-cpu-x64.zip"
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-windows-cpu-x64.zip
          name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-windows-cpu-x64.zip
          archive: false

  build-windows-cuda-x64:
    needs: check-version
    if: ${{ needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force }}
    runs-on: windows-2022
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout whisper.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
          ref: ${{ needs.check-version.outputs.whisper-tag }}
          fetch-tags: 'true'
      - name: Install Ninja and unzip
        run: choco install ninja unzip -y
      - name: Install CUDA Toolkit 12.4
        shell: pwsh
        run: |
          $cudaVersion = "12.4"
          $cudaDir = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$cudaVersion"
          $cudaDownload = "https://developer.download.nvidia.com/compute/cuda/redist"
          $components = @{
            cuda_cudart              = "12.4.127"
            cuda_nvcc                = "12.4.131"
            cuda_nvrtc               = "12.4.127"
            libcublas                = "12.4.5.8"
            cuda_nvtx                = "12.4.127"
            cuda_profiler_api        = "12.4.127"
            visual_studio_integration = "12.4.127"
            cuda_nvprof              = "12.4.127"
            cuda_cccl                = "12.4.127"
          }

          New-Item -ItemType Directory -Force -Path $cudaDir | Out-Null
          foreach ($component in $components.GetEnumerator()) {
            $archive = "$($component.Key)-windows-x86_64-$($component.Value)-archive"
            curl.exe -L --fail --retry 3 -o "$archive.zip" "$cudaDownload/$($component.Key)/windows-x86_64/$archive.zip"
            unzip -q "$archive.zip" -d $cudaDir
            Copy-Item "$cudaDir\$archive\*" $cudaDir -Recurse -Force
          }

          $buildCustomizations = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations"
          $integration = "$cudaDir\visual_studio_integration-windows-x86_64-$($components.visual_studio_integration)-archive\visual_studio_integration\MSBuildExtensions\*"
          Copy-Item $integration $buildCustomizations -Recurse -Force

          "$cudaDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$cudaDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_PATH_V12_4=$cudaDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build x64 CUDA 12.4
        shell: cmd
        working-directory: whisper.cpp
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DBUILD_SHARED_LIBS=ON ^
            -DWHISPER_BUILD_TESTS=OFF ^
            -DWHISPER_BUILD_EXAMPLES=OFF ^
            -DWHISPER_BUILD_SERVER=OFF ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BMI2=OFF ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_CUDA=ON ^
            -DGGML_BACKEND_DL=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="86;89"
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS%
      - name: Pack artifact
        shell: pwsh
        working-directory: whisper.cpp
        run: |
          $tag = "${{ needs.check-version.outputs.whisper-tag }}"
          $package = "package/whisper-$tag"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item build/bin/Release/*.dll $package
          Get-ChildItem "$env:CUDA_PATH\bin" -Filter "*.dll" | Copy-Item -Destination $package
          Compress-Archive -Path $package -DestinationPath "../whisper-$tag-bin-windows-cuda-x64.zip"
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-windows-cuda-x64.zip
          name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-windows-cuda-x64.zip
          archive: false

  # ─── Release ────────────────────────────────────────────────────────────

  release:
    needs:
      - check-version
      - build-cpu-amd64
      - build-cpu-arm64
      - build-cuda-amd64
      - build-cuda-arm64
      - build-vulkan-amd64
      - build-vulkan-arm64
      - build-darwin-xcframework
      - build-windows-cpu-x64
      - build-windows-cuda-x64
    if: ${{ github.event_name != 'pull_request' && (needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Download CPU x64 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-x64.tar.gz
          destination: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-x64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download CPU arm64 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-arm64.tar.gz
          destination: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cpu-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download CUDA x64 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-x64.tar.gz
          destination: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-x64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download CUDA arm64 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-arm64.tar.gz
          destination: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-cuda-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Vulkan x64 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-x64.tar.gz
          destination: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-x64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Vulkan arm64 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-arm64.tar.gz
          destination: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-ubuntu-vulkan-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Darwin xcframework artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-darwin-metal-universal.zip
          destination: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-darwin-metal-universal.zip
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Windows CPU x64 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-windows-cpu-x64.zip
          destination: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-windows-cpu-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Windows CUDA x64 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-windows-cuda-x64.zip
          destination: whisper-${{ needs.check-version.outputs.whisper-tag }}-bin-windows-cuda-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build digest manifest
        id: digests
        env:
          TAG: ${{ needs.check-version.outputs.whisper-tag }}
          GENERATED: ${{ needs.check-version.outputs.generated }}
        run: |
          pin=$(.github/scripts/build-digests.py "$TAG" . digests --generated "$GENERATED")
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          {
            echo "### Release digest manifest"
            echo '```'
            echo "$pin"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-version.outputs.whisper-tag }}
          name: ${{ needs.check-version.outputs.whisper-tag }}
          artifacts: "*.tar.gz,*.zip,digests/*.json,digests/*.json.sha256"
          allowUpdates: true
          replacesArtifacts: true
          body: |
            Prebuilt whisper.cpp ${{ needs.check-version.outputs.whisper-tag }} libraries for Linux, macOS, and Windows.

            Used by [bucky](https://github.com/ardanlabs/bucky)'s `bucky install` command.

            Digest manifest pin: `${{ steps.digests.outputs.pin }}`
      - name: Commit digest manifest
        env:
          TAG: ${{ needs.check-version.outputs.whisper-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "digests/${TAG}.json" "digests/${TAG}.json.sha256"
          if git diff --cached --quiet -- digests; then
            echo "Digest files for ${TAG} are already committed"
            exit 0
          fi
          git commit -m "digests: publish ${TAG} manifest"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1

  publish-version:
    needs:
      - check-version
      - release
    if: ${{ github.event_name != 'pull_request' && (needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force) }}
    uses: ./.github/workflows/publish-version.yml
    with:
      tag: ${{ needs.check-version.outputs.whisper-tag }}

  trigger-bucky-tests:
    needs:
      - check-version
      - publish-version
    if: ${{ github.event_name != 'pull_request' && (needs.check-version.outputs.whisper-tag != needs.check-version.outputs.current-tag || inputs.force) }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger bucky CI
        # Requires a repo-level secret BUCKY_BUILD_ACCESS = a PAT with
        # `actions:write` on ardanlabs/bucky. Without it this step is skipped
        # gracefully (we don't want the release itself to fail because the
        # downstream nudge couldn't fire).
        if: ${{ env.BUCKY_BUILD_ACCESS != '' }}
        env:
          BUCKY_BUILD_ACCESS: ${{ secrets.BUCKY_BUILD_ACCESS }}
        run: |
          for wf in linux.yml macos.yml windows.yml; do
            curl -fsSL -X POST \
              -H "Authorization: Bearer $BUCKY_BUILD_ACCESS" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/ardanlabs/bucky/actions/workflows/$wf/dispatches" \
              -d '{"ref":"main"}'
          done
